name: Build Blocks Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: blocks.exe
            os_name: windows
            archive_ext: zip
            configure_preset: conan-default
            build_preset: conan-release

          - os: ubuntu-latest
            artifact_name: blocks
            os_name: linux
            archive_ext: tar.gz
            configure_preset: conan-release
            build_preset: conan-release
          
          - os: macos-latest 
            artifact_name: blocks
            os_name: macos
            archive_ext: zip
            configure_preset: conan-release
            build_preset: conan-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # --- SYSTEM DEPENDENCIES (Linux) ---
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libasound2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan
        run: |
          pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Detect Conan Profile
        run: |
          conan profile detect --force

      - name: Install Dependencies via Conan
        run: |
          conan install . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.configure_preset }}

      - name: Build with CMake
        run: |
          cmake --build --preset ${{ matrix.build_preset }}

      # --- PACKAGE: macOS .app bundle with code signing ---
      - name: Package macOS App Bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION_TAG="${VERSION_TAG//\//-}"
          FINAL_ARCHIVE="blocks-${{ matrix.os_name }}-${VERSION_TAG}.${{ matrix.archive_ext }}"
          echo "FINAL_ARCHIVE=$FINAL_ARCHIVE" >> $GITHUB_ENV

          # 1. Create .app bundle structure
          APP_DIR="dist/City Bloxx.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # 2. Copy the self-contained executable
          cp "build/Release/${{ matrix.artifact_name }}" "${APP_DIR}/Contents/MacOS/"
          chmod +x "${APP_DIR}/Contents/MacOS/${{ matrix.artifact_name }}"

          # 3. Generate .icns from background.png (cropped & zoomed to building)
          ICONSET_DIR="$(mktemp -d)/blocks.iconset"
          mkdir -p "${ICONSET_DIR}"

          # Crop to a square centered on the building (70% width, biased upward)
          W=$(sips -g pixelWidth textures/background.png | tail -1 | awk '{print $2}')
          H=$(sips -g pixelHeight textures/background.png | tail -1 | awk '{print $2}')
          CROP_SIZE=$(( W * 70 / 100 ))
          cp textures/background.png /tmp/icon_source.png
          sips --cropToHeightWidth ${CROP_SIZE} ${CROP_SIZE} /tmp/icon_source.png --out /tmp/icon_cropped.png

          sips -z   16   16 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_16x16.png"
          sips -z   32   32 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_16x16@2x.png"
          sips -z   32   32 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_32x32.png"
          sips -z   64   64 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_32x32@2x.png"
          sips -z  128  128 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_128x128.png"
          sips -z  256  256 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_128x128@2x.png"
          sips -z  256  256 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_256x256.png"
          sips -z  512  512 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_256x256@2x.png"
          sips -z  512  512 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_512x512.png"
          sips -z 1024 1024 /tmp/icon_cropped.png --out "${ICONSET_DIR}/icon_512x512@2x.png"

          iconutil -c icns "${ICONSET_DIR}" -o "${APP_DIR}/Contents/Resources/blocks.icns"

          # 4. Create Info.plist
          cat > "${APP_DIR}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>blocks</string>
              <key>CFBundleIconFile</key>
              <string>blocks.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.blocks.citybloxx</string>
              <key>CFBundleName</key>
              <string>City Bloxx</string>
              <key>CFBundleDisplayName</key>
              <string>City Bloxx</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # 5. Ad-hoc code sign (eliminates the Gatekeeper "unverified" warning)
          codesign --force --deep -s - "${APP_DIR}"

          # 6. Create the release archive
          cd dist
          zip -r "$FINAL_ARCHIVE" "City Bloxx.app"

      # --- PACKAGE: Windows / Linux (single executable, no external assets) ---
      - name: Package Executable (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION_TAG="${VERSION_TAG//\//-}"
          FINAL_ARCHIVE="blocks-${{ matrix.os_name }}-${VERSION_TAG}.${{ matrix.archive_ext }}"
          echo "FINAL_ARCHIVE=$FINAL_ARCHIVE" >> $GITHUB_ENV

          mkdir -p dist/blocks
          cp "build/Release/${{ matrix.artifact_name }}" dist/blocks/

          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python -c "import shutil; shutil.make_archive('blocks', 'zip', '.', 'blocks')"
            mv blocks.zip "$FINAL_ARCHIVE"
          else
            chmod +x "blocks/${{ matrix.artifact_name }}"
            tar -czvf "$FINAL_ARCHIVE" blocks
          fi

      # --- UPLOAD ARTIFACTS FOR DEBUGGING (Manual/Branch Runs) ---
      - name: Upload Debug Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: blocks-${{ runner.os }}
          path: dist/${{ env.FINAL_ARCHIVE }}

      # --- CREATE OFFICIAL RELEASE (Tag Pushes Only) ---
      - name: Rename and Upload Artifacts (Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.FINAL_ARCHIVE }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}